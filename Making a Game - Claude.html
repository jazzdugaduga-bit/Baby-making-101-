<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Baby Making 101</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&display=swap" rel="stylesheet">
<style>
:root{--page:#f3e6ee;--ink:#2a1a3a;--pink:#ff5d9e;--deep:#8a2c78;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--page:#140a18}}
:root[data-theme="dark"]{--page:#140a18}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;background:var(--page);display:grid;place-items:center;font-family:"Anton",Impact,"Arial Narrow",sans-serif;font-weight:400;letter-spacing:.02em;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
#stage{position:relative;width:min(100vw,calc(100dvh*1.7778));height:min(100dvh,calc(100vw*.5625));overflow:hidden;container-type:size;background:#000}
.screen{position:absolute;inset:0;display:none}.screen.on{display:block}
svg.art{position:absolute;inset:0;width:100%;height:100%}
#defs{position:absolute;width:0;height:0}
#title h1{position:absolute;left:0;right:0;top:9cqh;margin:0;text-align:center;font-weight:900;font-size:17cqh;line-height:1.02;color:#fff;-webkit-text-stroke:1.6cqh var(--deep);paint-order:stroke fill;text-shadow:0 1.6cqh 0 var(--deep)}
.heart{position:absolute;bottom:-10%;color:#fff;opacity:.55;animation:fl linear infinite}
@keyframes fl{to{transform:translateY(-120cqh)}}
.btn{font-family:inherit;font-weight:400;color:var(--ink);background:#fff;border:.7cqh solid var(--ink);border-radius:2.4cqh;box-shadow:0 1cqh 0 var(--ink);padding:1.8cqh 6cqh;font-size:6cqh;cursor:pointer}
.btn:active{transform:translateY(.8cqh);box-shadow:0 .2cqh 0 var(--ink)}.btn:focus-visible{outline:.8cqh solid var(--pink);outline-offset:1cqh}
#mute{position:absolute;left:83.4%;top:4.6%;width:14.4%;height:8.4%;z-index:40;font-size:4cqh;padding:0;box-shadow:none;border-width:.3cqh;border-radius:1.8cqh;background:#fff;color:#111;text-transform:uppercase}
#tb{position:absolute;left:6cqh;right:6cqh;bottom:2.5cqh;height:23cqh;z-index:20;background:#fff;border:.8cqh solid var(--ink);border-radius:2.4cqh;box-shadow:0 0 0 .7cqh #fff,0 0 0 1.4cqh var(--ink);padding:2.2cqh 4.5cqh;box-sizing:border-box;display:none}
#tb.on{display:block}
#txt{font-size:5.2cqh;line-height:1.3;color:var(--ink);height:100%;overflow:hidden;padding-right:5cqh}
#arrow{position:absolute;right:4cqh;bottom:3cqh;width:0;height:0;border:2.4cqh solid transparent;border-top:3cqh solid var(--ink);border-bottom:0;animation:ar .8s steps(2) infinite;visibility:hidden}
@keyframes ar{50%{transform:translateY(1cqh)}}
#dark{background:#000;color:#fff;text-align:center}
#dark p{position:absolute;left:0;right:0;top:38cqh;margin:0;font-size:8cqh;animation:fi 2s both}
@keyframes fi{from{opacity:0}}
#cv{position:absolute;inset:0;width:100%;height:100%}
#over,#end{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:5cqh;text-align:center;z-index:30;line-height:1.3}
#over{background:rgba(40,0,20,.8);color:#fff;font-size:9cqh}
#end{background:#fff;color:var(--ink);font-size:10cqh;z-index:60}
#end.show,#over.show{display:flex}
#white{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:50;transition:opacity 1.6s ease-in}
#fade{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;z-index:45;transition:opacity .4s}
@media (prefers-reduced-motion:reduce){.heart,#arrow{animation:none}}
.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.hit{position:absolute;background:transparent;border:0;cursor:pointer;padding:0;border-radius:3cqh}.hit:focus-visible{outline:.8cqh solid var(--pink)}
#dark .bg{animation:fi 1.6s both}

#cv2{position:absolute;inset:0;width:100%;height:100%}
#cap{display:none;position:absolute;left:5cqh;right:5cqh;bottom:2.5cqh;min-height:23cqh;background:#fff;border:.8cqh solid var(--ink);border-radius:2.4cqh;box-shadow:0 0 0 .7cqh #fff,0 0 0 1.4cqh var(--ink);padding:2cqh 3.5cqh;align-items:center;gap:3cqh;z-index:20;box-sizing:border-box}
#cap.on{display:flex}
#capT{flex:1;font-size:4.6cqh;line-height:1.28;color:var(--ink);animation:fi .5s both}
#cap .btn{font-size:5cqh;padding:1.2cqh 3.5cqh;white-space:nowrap;flex:none}
#foods{display:none;position:absolute;right:3cqw;top:21cqh;width:32cqw;z-index:15}
#fgrid{display:grid;grid-template-columns:1fr 1fr;gap:1.6cqh}
#fgrid .btn{font-size:4.4cqh;padding:1.1cqh .6cqh;box-shadow:0 .6cqh 0 var(--ink)}
#fb{margin-top:2.4cqh;font-size:3.8cqh;line-height:1.3;color:#fff;min-height:14cqh}
</style></head>
<body>
<svg id="defs" aria-hidden="true"><defs>
 <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6fc3ff"/><stop offset="1" stop-color="#e2f5ff"/></linearGradient>
 <linearGradient id="grass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8fd67f"/><stop offset="1" stop-color="#4aa857"/></linearGradient>
 <linearGradient id="night" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0b0b33"/><stop offset="1" stop-color="#43307a"/></linearGradient>
 <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#23468a"/><stop offset="1" stop-color="#0d1f45"/></linearGradient>
 <linearGradient id="tbg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffc9e2"/><stop offset="1" stop-color="#a98bf2"/></linearGradient>
 <linearGradient id="body" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#f4f6f9"/><stop offset="1" stop-color="#a9afb9"/></linearGradient>
 <radialGradient id="head" cx=".35" cy=".3" r=".75"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#aab0ba"/></radialGradient>
</defs></svg>
<div id="stage">
 <button class="btn" id="mute" aria-label="Toggle sound">Sound on</button>
 <section class="screen on" id="title"><img class="bg" id="iTitle" alt="Baby Making 101"><button class="hit" id="startBtn" aria-label="Start" style="left:33.3%;top:64.6%;width:33.1%;height:18.3%"></button></section>
 <section class="screen" id="wedOut"><img class="bg" id="iOut" alt=""></section>
 <section class="screen" id="wedIn"><img class="bg" id="iIn" alt=""></section>
 <section class="screen" id="honey"><img class="bg" id="iBeach" alt=""></section>
 <section class="screen" id="dark"><img class="bg" id="iDark" alt="Later that night"><button class="hit" id="goBtn" aria-label="Start" style="left:67.7%;top:69.6%;width:25.2%;height:13.5%"></button></section>
 <section class="screen" id="run"><canvas id="cv" width="960" height="540"></canvas>
  <div id="over"><div>Try again!</div><button class="btn" id="retry">Retry</button></div></section>
 <section class="screen" id="dev"><canvas id="cv2" width="960" height="540"></canvas>
  <div id="foods"><div id="fgrid"></div><div id="fb"></div></div>
  <div id="cap"><div id="capT"></div><button class="btn" id="nextBtn">Continue</button></div></section>
 <div id="tb"><div id="txt"></div><div id="arrow"></div></div>
 <div id="fade"></div><div id="white"></div>
 <div id="end"><img class="bg" id="iEnd" alt="A new life begins"><button class="hit" id="again" aria-label="Continue" style="left:37.1%;top:67.8%;width:25.8%;height:14.4%"></button></div>
</div>

let ac,master,mus,sfxG,muted=false,cur=null,step=0,nextT=0;
const mf=m=>440*Math.pow(2,(m-69)/12);
function initAudio(){
  if(ac){ac.resume();return}
  try{ac=new(window.AudioContext||window.webkitAudioContext)();master=ac.createGain();master.connect(ac.destination);
    mus=ac.createGain();mus.gain.value=.22;mus.connect(master);sfxG=ac.createGain();sfxG.gain.value=.5;sfxG.connect(master);
    setInterval(sched,50);ac.resume()}catch(e){ac=null}
}
function tone(f,t,d,type,g,dest,f2){
  const o=ac.createOscillator(),v=ac.createGain();o.type=type;o.frequency.setValueAtTime(f,t);
  if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);
  v.gain.setValueAtTime(g,t);v.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(v);v.connect(dest);o.start(t);o.stop(t+d+.03);
}
const sfx={
  select(){if(!ac)return;const t=ac.currentTime;tone(988,t,.06,'square',.35,sfxG);tone(1319,t+.06,.12,'square',.35,sfxG)},
  adv(){if(!ac)return;const t=ac.currentTime;tone(660,t,.05,'square',.3,sfxG);tone(880,t+.05,.09,'square',.3,sfxG)},
  text(){if(!ac)return;tone(520,ac.currentTime,.03,'square',.07,sfxG)},
  move(){if(!ac)return;tone(300,ac.currentTime,.08,'triangle',.3,sfxG,520)},
  hit(){if(!ac)return;tone(220,ac.currentTime,.25,'sawtooth',.4,sfxG,60)},
  win(){if(!ac)return;const t=ac.currentTime;[72,76,79,84,88].forEach((n,i)=>tone(mf(n),t+i*.11,.3,'square',.25,sfxG))}
};
const T={
 wed:{t:100,lead:[72,0,76,0,79,0,76,0,77,0,81,0,79,0,76,0,74,0,77,0,79,0,77,0,76,0,0,0,72,0,0,0],
      bass:[48,0,55,0,48,0,55,0,53,0,60,0,53,0,60,0,55,0,62,0,55,0,62,0,48,0,55,0,48,0,0,0]},
 run:{t:168,lead:[69,0,72,69,76,0,72,0,74,0,77,74,81,0,77,0,72,0,76,72,79,0,76,0,71,0,74,71,77,0,74,0],
      bass:[45,45,0,45,45,0,45,0,50,50,0,50,50,0,50,0,48,48,0,48,48,0,48,0,47,47,0,47,47,0,47,0]}
};
T.night={t:68,lead:T.wed.lead.map(n=>n&&n-12),bass:T.wed.bass};
function setMusic(n){cur=n?T[n]:null;step=0;if(ac)nextT=ac.currentTime+.08}
function sched(){
  if(!ac||!cur)return;
  while(nextT<ac.currentTime+.2){
    const s=step%cur.lead.length,d=60/cur.t/2;
    if(cur.lead[s])tone(mf(cur.lead[s]),nextT,d*.9,'square',.12,mus);
    if(cur.bass[s])tone(mf(cur.bass[s]),nextT,d*1.8,'triangle',.28,mus);
    nextT+=d;step++;
  }
}
$('mute').onclick=()=>{muted=!muted;if(master)master.gain.value=muted?0:1;$('mute').textContent=muted?'Sound off':'Sound on'};

/* ---------- screens, text box, story ---------- */
function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('on',s.id===id))}
function trans(fn){$('fade').style.opacity=1;setTimeout(()=>{fn();$('fade').style.opacity=0},420)}
let D=null;
function dialog(lines,done){
  const tb=$('tb'),txt=$('txt'),ar=$('arrow');let i=0,full=false,tm;
  tb.classList.add('on');
  function type(){
    txt.textContent='';ar.style.visibility='hidden';full=false;const s=lines[i];let c=0;clearInterval(tm);
    tm=setInterval(()=>{c++;txt.textContent=s.slice(0,c);if(c%3===0)sfx.text();
      if(c>=s.length){clearInterval(tm);full=true;ar.style.visibility='visible'}},34);
  }
  D=()=>{
    if(!full){clearInterval(tm);txt.textContent=lines[i];full=true;ar.style.visibility='visible';return}
    sfx.adv();i++;
    if(i>=lines.length){tb.classList.remove('on');D=null;done()}else type();
  };
  type();
}
$('tb').addEventListener('click',()=>D&&D());
addEventListener('keydown',e=>{if(D&&(e.key==='Enter'||e.key===' '))D()});

const c2=$('cv2'),g=c2.getContext('2d'),TAU=6.2832,W2=640,H2=360;
const lerp=(a,b,k)=>a+(b-a)*k,cl=(x,a=0,b=1)=>Math.min(b,Math.max(a,x)),sm=x=>x*x*(3-2*x);
let Q={run:0,sc:0,st:0,t:0,p:0,s:.4,feed:0,picks:0,last:0,shown:0,prog:0};

  if(Q.st===1){g.fillStyle='#b9824f';g.beginPath();g.roundRect(140,222,360,34,10);g.fill();g.fillStyle='#fff7ea';g.beginPath();g.roundRect(150,196,340,50,22);g.fill();newborn(300,186,1.4,t,0);
    if(!Q.shown){Q.shown=1;cry();cap(CT,null)}if(t>3.5&&Q.shown===1){Q.shown=2;cap(CT,'Continue',()=>{Q.st=2;Q.t=0;Q.shown=0;setMusic('wed')})}return}
  const x=330,y=160,s=1.5;mom(x,y,s,3);newborn(x-6,y+14,1.05,t,1);
  ln([[x-24*s,y-14*s],[x-20*s,y+26*s],[x+6*s,y+34*s]],'#f2c7a5',9*s);ln([[x+24*s,y-14*s],[x+22*s,y+28*s],[x-2*s,y+36*s]],'#f2c7a5',9*s);
  for(let i=0;i<7;i++)tx('♥',170+i*50,140-((t*22+i*41)%100)+40,16,'#ff5d9e','center',cl(1-((t*22+i*41)%100)/100));
  if(!Q.shown){Q.shown=1;cap(FIN,'Play again',()=>{Q.run=0;$('cap').classList.remove('on');setMusic(null);trans(()=>show('title'))})}}

/* ---------- sperm runner (landscape) ---------- */
const cv=$('cv'),cx=cv.getContext('2d'),W=640,H=360,LY=[100,180,260],PX=120;
let R=null;
function startRun(){
  $('over').classList.remove('show');
  R={lane:1,x:PX,y:180,t:0,prog:0,obs:[],lives:3,inv:0,spawn:1,state:'run',egg:780,last:performance.now()};
  setMusic('run');requestAnimationFrame(loop);
}
$('retry').onclick=startRun;
function move(d){if(!R||R.state!=='run'||R.over)return;const n=Math.max(0,Math.min(2,R.lane+d));if(n!==R.lane){R.lane=n;sfx.move()}}
addEventListener('keydown',e=>{if(e.key==='ArrowUp'||e.key==='w')move(-1);if(e.key==='ArrowDown'||e.key==='s')move(1)});
let ty=null,swiped=false;
cv.addEventListener('pointerdown',e=>{ty=e.clientY;swiped=false});
cv.addEventListener('pointermove',e=>{if(ty===null||swiped)return;const dy=e.clientY-ty;if(Math.abs(dy)>24){move(dy>0?1:-1);swiped=true}});
cv.addEventListener('pointerup',e=>{if(ty!==null&&!swiped&&Math.abs(e.clientY-ty)<10){const r=cv.getBoundingClientRect();move(e.clientY-r.top<r.height/2?-1:1)}ty=null});
function loop(now){
  if(!R||R.over)return;
  const dt=Math.min(.05,(now-R.last)/1000);R.last=now;upd(dt);draw();
  if(!R.over)requestAnimationFrame(loop);
}
function upd(dt){
  R.t+=dt;R.y+=(LY[R.lane]-R.y)*Math.min(1,dt*14);R.inv-=dt;
  const sp=200+R.prog*90;
  R.obs.forEach(o=>o.x-=sp*dt);R.obs=R.obs.filter(o=>o.x>-50);
  if(R.state==='run'){
    R.prog+=dt/34;R.spawn-=dt;
    if(R.spawn<=0&&R.prog<.9){
      R.spawn=.8-R.prog*.25+Math.random()*.3;
      const n=Math.random()<.3?2:1,ls=[0,1,2].sort(()=>Math.random()-.5).slice(0,n);
      ls.forEach(l=>R.obs.push({l,x:W+40,k:Math.random()<.5?0:1}));
    }
    if(R.inv<=0)for(const o of R.obs){
      if(Math.abs(LY[o.l]-R.y)<36&&Math.abs(o.x-R.x)<40){
        R.lives--;R.inv=1.3;sfx.hit();
        if(R.lives<=0){R.over=true;setMusic(null);$('over').classList.add('show')}
        break;
      }
    }
    if(R.prog>=1){R.state='egg';R.lane=1;R.obs=R.obs.filter(o=>o.x<R.x)}
  }else if(R.state==='egg'){
    R.egg=Math.max(470,R.egg-140*dt);if(R.egg<=470)R.state='enter';
  }else if(R.state==='enter'){
    R.lane=1;R.x+=150*dt;
    if(R.x>=415){R.state='done';R.over=true;sfx.win();setMusic(null);$('white').style.opacity=1;setTimeout(()=>$('end').classList.add('show'),1900)}
  }
}
function draw(){
  cx.setTransform(1.5,0,0,1.5,0,0);
  const g=cx.createLinearGradient(0,0,W,0);g.addColorStop(0,'#4a0d34');g.addColorStop(1,'#8a2347');
  cx.fillStyle=g;cx.fillRect(0,0,W,H);
  for(let i=0;i<14;i++){const x=W+30-((i*131+R.t*50*(.5+i%3*.3))%(W+60)),y=(i*47)%H;
    cx.fillStyle='rgba(255,150,180,.13)';cx.beginPath();cx.arc(x,y,8+i%4*5,0,7);cx.fill()}
  cx.strokeStyle='rgba(255,255,255,.1)';cx.lineWidth=2;cx.setLineDash([12,14]);
  [140,220].forEach(y=>{cx.beginPath();cx.moveTo(0,y);cx.lineTo(W,y);cx.stroke()});cx.setLineDash([]);
  if(R.state!=='run'){const ex=R.egg,ey=180;
    cx.fillStyle='rgba(255,220,240,.25)';cx.beginPath();cx.arc(ex,ey,82,0,7);cx.fill();
    cx.fillStyle='#ffe3ef';cx.beginPath();cx.arc(ex,ey,64,0,7);cx.fill();
    cx.fillStyle='#ffb6d3';cx.beginPath();cx.arc(ex,ey,30,0,7);cx.fill();
    cx.fillStyle='#ff7fb0';cx.beginPath();cx.arc(ex,ey,12,0,7);cx.fill()}
  for(const o of R.obs){const x=o.x,y=LY[o.l];
    if(o.k){cx.fillStyle='#8be05a';cx.beginPath();cx.arc(x,y,28,0,7);cx.fill();
      cx.fillStyle='#4f9a2f';[[-9,-6,6],[8,7,5],[6,-11,4]].forEach(b=>{cx.beginPath();cx.arc(x+b[0],y+b[1],b[2],0,7);cx.fill()})}
    else{cx.fillStyle='#e8e4f2';cx.beginPath();cx.arc(x,y,28,0,7);cx.fill();
      cx.fillStyle='#8a5cc8';cx.beginPath();cx.arc(x-4,y-3,14,0,7);cx.fill();
      cx.fillStyle='#b48ae8';cx.beginPath();cx.arc(x+7,y+6,7,0,7);cx.fill()}}
  if(!(R.inv>0&&Math.floor(R.t*14)%2)){
    cx.strokeStyle='#fff';cx.lineCap='round';
    for(let i=0;i<14;i++){const xx=R.x-14-i*8,yy=R.y+Math.sin(R.t*12-i*.6)*(3+i*.9),nx=xx-8,ny=R.y+Math.sin(R.t*12-(i+1)*.6)*(3+(i+1)*.9);
      cx.lineWidth=Math.max(2,8-i*.5);cx.beginPath();cx.moveTo(xx,yy);cx.lineTo(nx,ny);cx.stroke()}
    cx.fillStyle='#fff';cx.beginPath();cx.ellipse(R.x,R.y,20,15,0,0,7);cx.fill();
    cx.fillStyle='#ffc2dc';cx.beginPath();cx.ellipse(R.x+5,R.y,11,9,0,0,7);cx.fill();
    cx.fillStyle='#2a1a3a';cx.beginPath();cx.arc(R.x+8,R.y-4,2.2,0,7);cx.arc(R.x+8,R.y+4,2.2,0,7);cx.fill()}
  cx.fillStyle='rgba(0,0,0,.35)';cx.fillRect(16,14,180,12);
  cx.fillStyle='#ff5d9e';cx.fillRect(18,16,176*Math.min(1,R.prog),8);
  cx.font='20px Anton,sans-serif';cx.fillStyle='#fff';cx.textAlign='right';
  cx.fillText('♥'.repeat(Math.max(0,R.lives)),622,30);
  if(R.t<3.2){cx.textAlign='center';cx.font='22px Anton,sans-serif';cx.fillText('Swipe or tap up / down to dodge!',W/2,40)}
}
